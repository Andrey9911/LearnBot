<section class="learn-widget" aria-label="Прогресс обучения">
  <div class="learn-widget__progress">
    <div class="learn-widget__summary">
      <span class="learn-widget__level" id="english-level"></span>
      <span class="learn-widget__language">Английский</span>
      <span class="learn-widget__divider"></span>
      <span class="learn-widget__score"><span id="english-score"></span> / 100</span>
    </div>
    <div class="learn-widget__track">
      <span class="learn-widget__fill" id="english-progress"></span>
    </div>
  </div>
  <div class="learn-widget__course">
    <span class="learn-widget__eyebrow">КУРС</span>
    <span class="learn-widget__course-title" id="course-title"></span>
  </div>
  <div class="learn-widget__lesson-row">
    <div class="learn-widget__module">
      <span class="learn-widget__eyebrow">МОДУЛЬ</span>
      <span class="learn-widget__module-title" id="module-title"></span>
    </div>
    <div class="learn-widget__current-lesson">
      <span class="learn-widget__eyebrow">ТЕКУЩИЙ УРОК</span>
      <span class="learn-widget__lesson-count" id="current-lesson"></span>
    </div>
  </div>
  <div class="learn-widget__lives-row">
    <div class="learn-widget__lives-info">
      <span class="learn-widget__lives-label">Жизни</span>
      <span class="learn-widget__lives-refresh" id="lives-refresh"></span>
    </div>
    <span class="learn-widget__hearts" id="lives" aria-label="Жизни"></span>
  </div>
</section>
